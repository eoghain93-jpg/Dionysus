name: Deploy Database Migrations

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The CLI's PostHog telemetry flush can hang on CI runners and fail
      # the job with exit 1 even after the real command succeeded (seen
      # 2026-07-27: "Timeout while shutting down PostHog" killed the run
      # after "Finished supabase link.").
      - name: Disable CLI telemetry
        run: supabase telemetry disable

      - name: Link project
        run: supabase link --project-ref sqpokcnoefhfmcvdttqu
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
