name: Deploy Database Migrations

on:
  push:
    branches:
      - master
    paths:
      - 'supabase/migrations/**'
      # A fix to this workflow must run too, or migrations that failed to
      # deploy stay undeployed until the next migration is merged.
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The CLI's PostHog telemetry flush can hang on CI runners and fail
      # the job with exit 1 even after the real command succeeded (seen
      # 2026-07-27: "Timeout while shutting down PostHog" killed the run
      # after "Finished supabase link.").
      - name: Disable CLI telemetry
        run: supabase telemetry disable

      - name: Link project
        run: supabase link --project-ref sqpokcnoefhfmcvdttqu
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # --remote: since the CLI release picked up by `version: latest` around
      # 20 Nov 2026, a bare `db push` targets the local Docker stack and fails
      # with ECONNREFUSED 127.0.0.1:54322 instead of pushing to the linked
      # project.
      # --yes: since the CLI release picked up by `version: latest` on
      # 23 Nov 2026, `db push` asks "Apply N migrations?" and, with no
      # terminal to ask, exits 1 with "Confirmation required ... Nothing was
      # changed." Merging to master is the confirmation.
      - name: Run migrations
        run: supabase db push --remote --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
